<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="HEK75 OS — Harun Emrecan Karabağ | Game Developer & Software Engineer">
  <defs>
    <radialGradient id="crtBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0a1a0d" />
      <stop offset="70%" stop-color="#020704" />
      <stop offset="100%" stop-color="#000201" />
    </radialGradient>
    <linearGradient id="crtBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#344a38" />
      <stop offset="50%" stop-color="#142416" />
      <stop offset="100%" stop-color="#0e1b10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Shell background -->
  <rect width="1200" height="630" fill="#040905" />

  <!-- CRT Cabinet Screen Chassis -->
  <rect x="36" y="36" width="1128" height="558" rx="28" fill="url(#crtBg)" stroke="url(#crtBorder)" stroke-width="4" />

  <!-- Scanlines Subtle Pattern -->
  <g opacity="0.08">
    <line x1="40" y1="90" x2="1160" y2="90" stroke="#7dff85" stroke-width="1" />
    <line x1="40" y1="170" x2="1160" y2="170" stroke="#7dff85" stroke-width="1" />
    <line x1="40" y1="250" x2="1160" y2="250" stroke="#7dff85" stroke-width="1" />
    <line x1="40" y1="330" x2="1160" y2="330" stroke="#7dff85" stroke-width="1" />
    <line x1="40" y1="410" x2="1160" y2="410" stroke="#7dff85" stroke-width="1" />
    <line x1="40" y1="490" x2="1160" y2="490" stroke="#7dff85" stroke-width="1" />
    <line x1="40" y1="570" x2="1160" y2="570" stroke="#7dff85" stroke-width="1" />
  </g>

  <!-- Top Status Bar -->
  <g font-family="Courier New, monospace" font-size="16" letter-spacing="4" fill="#4a8a50">
    <text x="80" y="88">HEK75 OS // SYSTEM READY</text>
    <text x="890" y="88">ONLINE // 2026</text>
  </g>

  <!-- Main Hero Brand (HEK75 OS) -->
  <text x="80" y="240" fill="#7dff85" font-family="'Courier New', monospace, sans-serif" font-size="108" font-weight="900" letter-spacing="-3" filter="url(#glow)">HEK75 OS</text>

  <!-- Full Name -->
  <text x="84" y="320" fill="#ffffff" font-family="'Courier New', monospace, sans-serif" font-size="44" font-weight="800" letter-spacing="6">HARUN EMRECAN KARABAĞ</text>

  <!-- Role Subtitle -->
  <text x="84" y="380" fill="#ffe66d" font-family="'Courier New', monospace, sans-serif" font-size="28" font-weight="700" letter-spacing="4">GAME DEVELOPER // SOFTWARE ENGINEER</text>

  <!-- Tech tags badge bar -->
  <g font-family="'Courier New', monospace" font-size="20" font-weight="600" fill="#a5d6a7" letter-spacing="2">
    <rect x="80" y="440" width="1040" height="54" rx="8" fill="#0c1e11" stroke="#234a29" stroke-width="1" />
    <text x="110" y="475">UNITY  •  UNREAL ENGINE  •  C#  •  C++  •  GAMEPLAY SYSTEMS</text>
  </g>

  <!-- Footer Link -->
  <g font-family="'Courier New', monospace" font-size="16" letter-spacing="3" fill="#4a8a50">
    <text x="80" y="545">HTTPS://HEK75.COM</text>
    <text x="870" y="545">PORTFOLIO &amp; GAME LAB</text>
  </g>
</svg>
